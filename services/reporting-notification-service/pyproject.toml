[project]
name = "reporting-notification-service"
version = "0.1.0"
description = "Формирование PDF/XLSX-отчётов и доставка уведомлений о назначениях, сроках и результатах."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
