name: learning-platform

services:
  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "8000:8000"
    environment:
      IDENTITY_ORGANIZATION_SERVICE_URL: http://identity-organization-service:8000
      ASSESSMENT_TESTING_SERVICE_URL: http://assessment-testing-service:8000
    depends_on:
      - identity-organization-service
      - assessment-testing-service

  identity-organization-service:
    build: ./services/identity-organization-service
    environment:
      SERVICE_NAME: identity-organization-service

  assessment-testing-service:
    build: ./services/assessment-testing-service
    environment:
      SERVICE_NAME: assessment-testing-service

  learning-service:
    build: ./services/learning-service
    environment:
      SERVICE_NAME: learning-service

  knowledge-ai-service:
    build: ./services/knowledge-ai-service
    environment:
      SERVICE_NAME: knowledge-ai-service

  proctoring-service:
    build: ./services/proctoring-service
    environment:
      SERVICE_NAME: proctoring-service

  adaptive-learning-service:
    build: ./services/adaptive-learning-service
    environment:
      SERVICE_NAME: adaptive-learning-service

  analytics-service:
    build: ./services/analytics-service
    environment:
      SERVICE_NAME: analytics-service

  reporting-notification-service:
    build: ./services/reporting-notification-service
    environment:
      SERVICE_NAME: reporting-notification-service

  message-broker:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
